services:
  postpal:
    build:
      context: .
      args:
        VERSION: ${VERSION:-dev}
    image: ${DOCKERHUB_USERNAME:-enginerd}/postpal:${VERSION:-latest}
    container_name: postpal
    restart: unless-stopped
    volumes:
      - session:/app/session
      - repo:/app/repo
    environment:
      - TZ=${TZ:-America/New_York}
      - TELEGRAM_API_ID=${TELEGRAM_API_ID}
      - TELEGRAM_API_HASH=${TELEGRAM_API_HASH}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHANNEL=${TELEGRAM_CHANNEL}
      - TELEGRAM_AUTHOR=${TELEGRAM_AUTHOR}
      - SESSION_DIR=/app/session
      - GIT_REPO_URL=${GIT_REPO_URL}
      - GIT_REPO_DIR=/app/repo
      - GIT_BRANCH=${GIT_BRANCH:-master}
      - GIT_AUTH_TOKEN=${GIT_AUTH_TOKEN}
      - GIT_AUTHOR_NAME=${GIT_AUTHOR_NAME:-PostPal}
      - GIT_AUTHOR_EMAIL=${GIT_AUTHOR_EMAIL:-bot@postpal.dev}
      - ZOLA_POSTS_DIR=${ZOLA_POSTS_DIR:-content/posts}
      - POSTPAL_VERBOSE=${POSTPAL_VERBOSE:-false}

volumes:
  session:
  repo:

networks:
  default:
    name: postpal-network
